<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel - Ludo Baji</title>
<style>
:root{--g:#18ad59;--d:#242b28;--c:#303934;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#202522}.wrap{max-width:1000px;margin:auto;padding:18px}.top{background:var(--d);color:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px}.top img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff}.top h1{font-size:22px;margin:0;flex:1}.logout{border:0;background:#e84c4c;color:#fff;padding:10px 14px;border-radius:9px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;margin-top:18px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000d}.card h2{margin:0 0 16px;font-size:20px}.label{font-weight:bold;display:block;margin:12px 0 6px}.input,textarea{width:100%;border:1px solid #d8dedb;border-radius:10px;padding:12px;font-size:15px;outline:0}.input:focus,textarea:focus{border-color:var(--g)}textarea{min-height:110px;resize:vertical}.save{margin-top:14px;border:0;background:var(--g);color:#fff;padding:12px 17px;border-radius:10px;font-weight:bold;cursor:pointer}.preview{margin-top:10px;max-width:90px;max-height:70px;object-fit:contain;border-radius:10px}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}.option{background:#f6f8f7;border:1px solid #e2e7e4;border-radius:12px;padding:13px;margin-bottom:10px}.option strong{font-size:16px}.small{font-size:12px;color:#69736e}.actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:bold}.edit{background:#e9f5ee;color:#137a40}.hide{background:#fff1cf;color:#8b6500}.del{background:#ffe5e5;color:#b32626}.add{background:#242b28;color:#fff}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}.loginbox h1{text-align:center}.msg{color:#c33;text-align:center;min-height:20px}.hint{font-size:12px;color:#777;margin-top:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top h1{font-size:18px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>⚙️ Admin Panel</h1><p style="text-align:center;color:#68716d">Ludo Baji</p><label class="label">Username</label><input id="user" class="input" value="admin"><label class="label">Password</label><input id="pass" class="input" type="password" placeholder="admin123"><button class="save" style="width:100%" onclick="login()">Login</button><div id="msg" class="msg"></div><div class="hint">Demo login: admin / admin123</div></div></div>
<div id="panel" style="display:none"><div class="wrap"><div class="top"><img id="topLogo" src="7543.jpg"><h1 id="topName">Ludo Baji — Admin Panel</h1><button class="logout" onclick="logout()">Logout</button></div>
<div class="grid"><div class="card"><h2>System Settings</h2><label class="label">System Name</label><input id="sysName" class="input"><label class="label">System Logo</label><input id="logoFile" class="input" type="file" accept="image/*"><img id="logoPreview" class="preview"><button class="save" onclick="saveSettings()">Save Settings</button><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><h2>Add New Option</h2><label class="label">Option Name</label><input id="newName" class="input" placeholder="যেমন: Deposit"><label class="label">Icon / Emoji</label><input id="newIcon" class="input" placeholder="💳"><label class="label">Content</label><textarea id="newContent" placeholder="এই Option-এ click করলে লাল জায়গায় যা দেখাবে..."></textarea><button class="save" onclick="addOption()">+ Add Option</button></div>
<div class="card"><h2>Options Management</h2><div id="options"></div></div></div></div></div>
<script>
const defaults=[
{id:'match',name:'Match',icon:'🎮',content:'Match system-এর content এখানে Auto Show হবে।',show:true},
{id:'deposit',name:'Deposit',icon:'💳',content:'Deposit system-এর content এখানে Auto Show হবে।',show:true},
{id:'statement',name:'My Statement',icon:'🏷️',content:'My Statement system-এর content এখানে Auto Show হবে।',show:true},
{id:'withdraw',name:'Withdraw',icon:'💰',content:'Withdraw system-এর content এখানে Auto Show হবে।',show:true},
{id:'support',name:'Support',icon:'✅',content:'Support system-এর content এখানে Auto Show হবে।',show:true},
{id:'mymatch',name:'My Match',icon:'🎮',content:'My Match system-এর content এখানে Auto Show হবে।',show:true}
];
function getOptions(){try{let x=JSON.parse(localStorage.getItem('ludoBajiOptions'));return Array.isArray(x)?x:defaults}catch(e){return defaults}}
function setOptions(x){localStorage.setItem('ludoBajiOptions',JSON.stringify(x))}
function settings(){try{return JSON.parse(localStorage.getItem('ludoBajiSettings'))||{name:'Ludo Baji',logo:'7543.jpg'}}catch(e){return {name:'Ludo Baji',logo:'7543.jpg'}}}
function load(){let s=settings();sysName.value=s.name;topName.textContent=s.name+' — Admin Panel';topLogo.src=s.logo;logoPreview.src=s.logo;renderOptions()}
function renderOptions(){options.innerHTML='';getOptions().forEach((o,i)=>{let d=document.createElement('div');d.className='option';d.innerHTML=`<div><strong>${esc(o.icon)} ${esc(o.name)}</strong> <span class="small">${o.show===false?'(Hidden)':'(Visible)'}</span></div><div class="small" style="margin-top:5px">${esc(o.content).slice(0,140)}</div><div class="actions"><button class="btn edit" onclick="editOption(${i})">Edit</button><button class="btn hide" onclick="toggleOption(${i})">${o.show===false?'Show':'Hide'}</button><button class="btn del" onclick="deleteOption(${i})">Delete</button></div>`;options.appendChild(d)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function saveSettings(){let s=settings();s.name=sysName.value.trim()||'Ludo Baji';localStorage.setItem('ludoBajiSettings',JSON.stringify(s));load();alert('Settings saved')}
logoFile.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let s=settings();s.logo=r.result;localStorage.setItem('ludoBajiSettings',JSON.stringify(s));load()};r.readAsDataURL(f)};
function addOption(){let name=newName.value.trim();if(!name)return alert('Option Name দিন');let x=getOptions();x.push({id:'opt_'+Date.now(),name,icon:newIcon.value.trim()||'📌',content:newContent.value.trim()||name+' system-এর content এখানে Auto Show হবে।',show:true});setOptions(x);newName.value='';newIcon.value='';newContent.value='';renderOptions()}
function editOption(i){let x=getOptions(),o=x[i];let n=prompt('Option Name:',o.name);if(n===null)return;let ic=prompt('Icon / Emoji:',o.icon);if(ic===null)return;let c=prompt('Content:',o.content);if(c===null)return;o.name=n.trim()||o.name;o.icon=ic.trim()||o.icon;o.content=c;o.show=o.show!==false;setOptions(x);renderOptions()}
function toggleOption(i){let x=getOptions();x[i].show=x[i].show===false;setOptions(x);renderOptions()}
function deleteOption(i){if(!confirm('এই Option delete করবেন?'))return;let x=getOptions();x.splice(i,1);setOptions(x);renderOptions()}
function login(){if(user.value==='admin'&&pass.value==='admin123'){sessionStorage.ludoAdmin='1';showPanel()}else msg.textContent='Username অথবা Password ভুল'}
function showPanel(){loginEl.style.display='none';panel.style.display='block';load()}
function logout(){sessionStorage.removeItem('ludoAdmin');location.reload()}
const loginEl=document.getElementById('login');
if(sessionStorage.ludoAdmin==='1')showPanel();
</script></body></html>
