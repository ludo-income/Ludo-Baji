<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ludo Baji Admin Panel</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#07152a;color:#fff}button,input,textarea{font:inherit}.login{height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#10b9d2,#1586d9);padding:20px}.login-card{width:min(430px,100%);background:#fff;color:#20252b;border-radius:24px;padding:28px;box-shadow:0 25px 70px #001a3a55}.login-card h1{margin:0 0 24px;font-size:30px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d7dde4;border-radius:10px;outline:0;background:#fff;color:#111}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.green{background:#19b466;color:#fff}.blue{background:#1168df;color:#fff}.red{background:#ef5350;color:#fff}.gray{background:#e9eef3;color:#27313b}.error{color:#d33;margin-top:10px;min-height:20px}.app{height:100vh;display:flex;background:#07152a}.sidebar{width:260px;min-width:260px;height:100vh;background:#173a70;display:flex;flex-direction:column;border-right:1px solid #294b7c}.brand{height:142px;min-height:142px;text-align:center;padding:14px 8px;border-bottom:1px solid #ffffff16}.brand img{width:66px;height:66px;border-radius:16px;object-fit:cover;background:#000}.brand b{display:block;font-size:21px;margin-top:7px}.brand small{display:block;color:#b9cbe5;margin-top:4px}.nav{flex:1;overflow-y:auto;padding:10px 10px 18px}.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#ffffff45;border-radius:8px}.nav button{width:100%;display:flex;align-items:center;gap:12px;color:#fff;background:transparent;border:0;border-radius:10px;padding:10px 11px;margin:2px 0;text-align:left;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#0f65d8}.nav .ico{width:24px;text-align:center;font-size:18px;flex:0 0 24px}.main{min-width:0;flex:1;height:100vh;display:flex;flex-direction:column;background:#07152a}.top{height:82px;min-height:82px;background:#0a1b33;border-bottom:1px solid #213a5c;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.top-left{display:flex;align-items:center;gap:16px}.top-brand{font-size:25px;font-weight:900}.top-brand span{color:#ffc400}.admin-pill{background:#2632a0;border-radius:9px;padding:10px 15px;font-weight:800}.online{color:#20d878;font-size:13px;margin-right:20px}.logout{background:#ed5553;color:#fff;border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.content{min-height:0;flex:1;padding:18px;overflow:hidden}.screen{height:100%;overflow:auto;background:#0b1d35;border:1px solid #223d61;border-radius:12px;padding:24px}.screen::-webkit-scrollbar{width:7px}.screen::-webkit-scrollbar-thumb{background:#345a86;border-radius:10px}.screen-title{display:flex;align-items:center;gap:15px;border-bottom:1px solid #284362;padding-bottom:18px;margin-bottom:20px}.screen-icon{width:54px;height:54px;border-radius:12px;background:#1065d8;display:grid;place-items:center;font-size:27px;overflow:hidden}.screen-icon img{width:100%;height:100%;object-fit:cover}.screen-title h1{margin:0 0 4px;font-size:27px}.screen-title p{margin:0;color:#9bb0ca}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat{background:#102844;border:1px solid #274565;border-radius:13px;padding:18px}.stat small{color:#93a9c3}.stat strong{display:block;font-size:27px;margin-top:6px}.panel{background:#0f2540;border:1px solid #294865;border-radius:13px;padding:18px;margin-top:16px}.panel h2{margin:0 0 15px;font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{color:#b8c8dc}.field input,.field textarea{background:#091a2e;border-color:#34516e;color:#fff}.field textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.option-editor{display:grid;grid-template-columns:50px 1.1fr 1.5fr 110px 170px;gap:9px;align-items:center;padding:10px;border:1px solid #294865;border-radius:10px;background:#0b1f37;margin:8px 0}.option-editor input,.option-editor textarea{width:100%;background:#07182c;border:1px solid #34516e;color:#fff;border-radius:8px;padding:9px}.option-editor textarea{min-height:42px}.option-logo{width:42px;height:42px;border-radius:9px;background:#123861;display:grid;place-items:center;overflow:hidden;font-size:21px}.option-logo img{width:100%;height:100%;object-fit:cover}.mini-actions{display:flex;gap:6px;flex-wrap:wrap}.file{font-size:11px;color:#aac0d8}.preview{width:60px;height:60px;object-fit:cover;border-radius:10px;background:#07182c}.toast{position:fixed;right:20px;bottom:20px;background:#12263f;border:1px solid #385574;padding:12px 16px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.sidebar{width:235px;min-width:235px}.top{padding:0 14px}.top-brand{font-size:19px}.admin-pill{display:none}.online{margin-right:8px}.screen{padding:16px}.stats{grid-template-columns:1fr 1fr}.option-editor{grid-template-columns:45px 1fr 1fr}.option-editor .actions{grid-column:1/-1}}@media(max-width:600px){.sidebar{width:205px;min-width:205px}.brand{height:125px;min-height:125px}.brand img{width:55px;height:55px}.brand b{font-size:17px}.nav button{font-size:12px;padding:9px 7px;gap:8px}.top{height:62px;min-height:62px}.top-brand{font-size:16px}.logout{padding:9px 11px}.online{font-size:11px}.content{padding:8px}.screen-title h1{font-size:21px}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.option-editor{grid-template-columns:42px 1fr}.option-editor textarea,.option-editor .visibility,.option-editor .actions{grid-column:1/-1}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const root=document.getElementById('root');let token=localStorage.getItem('lb_admin_token');let data=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
function loginView(){root.innerHTML=`<div class="login"><form class="login-card" onsubmit="loginAdmin(event)"><h1>⚙️ Admin Login</h1><div class="field"><label>Username</label><input id="loginUser" value="admin" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" value="admin123" autocomplete="current-password"></div><button class="btn green" style="width:100%">Login</button><div id="loginError" class="error"></div></form></div>`}
async function loginAdmin(e){e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value,password:document.getElementById('loginPass').value})});const j=await r.json();if(!r.ok){document.getElementById('loginError').textContent=j.error||'Login failed';return}token=j.token;localStorage.setItem('lb_admin_token',token);await load()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const j=await r.json();if(r.status===401){logout();throw Error('Unauthorized')}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{data=await (await api('/api/admin/data')).data;renderApp();selectPage(data.options[0]?.id)}catch(e){loginView()}}
function renderApp(){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><img id="brandLogo" src="${esc(data.site.logo)}"><b id="brandName">${esc(data.site.name)}</b><small>ADMIN PANEL</small></div><nav class="nav" id="nav"></nav></aside><section class="main"><header class="top"><div class="top-left"><div class="top-brand">${esc(data.site.name)}</div><div class="admin-pill">Admin Panel</div></div><div><span class="online">● Online</span><button class="logout" onclick="logout()">Logout</button></div></header><main class="content"><div class="screen" id="screen"></div></main></section></div>`;renderNav()}
function renderNav(){document.getElementById('nav').innerHTML=data.options.filter(o=>o.visible).map(o=>`<button id="nav-${esc(o.id)}" onclick="selectPage('${esc(o.id)}')"><span class="ico">${o.logo?`<img src="${esc(o.logo)}" style="width:22px;height:22px;border-radius:5px;object-fit:cover">`:esc(o.icon)}</span><span>${esc(o.name)}</span></button>`).join('')}
function iconHtml(o){return o.logo?`<img src="${esc(o.logo)}">`:esc(o.icon)}
function selectPage(id){const o=data.options.find(x=>x.id===id)||data.options.find(x=>x.visible);if(!o)return;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+o.id)?.classList.add('active');document.getElementById('screen').innerHTML=pageHtml(o);}
function pageHtml(o){if(o.id==='settings')return settingsHtml(o);return `<div class="screen-title"><div class="screen-icon">${iconHtml(o)}</div><div><h1>${esc(o.name)}</h1><p>${esc(o.content)}</p></div></div><div class="stats"><div class="stat"><small>SECTION</small><strong>${esc(o.name)}</strong></div><div class="stat"><small>STATUS</small><strong>${o.visible?'Active':'Hidden'}</strong></div><div class="stat"><small>OPTION LOGO</small><strong>${o.logo?'Custom':'Default'}</strong></div></div><div class="panel"><h2>${esc(o.name)}</h2><p style="color:#a9bbd0;line-height:1.7">${esc(o.content)}</p></div>`}
function settingsHtml(){return `<div class="screen-title"><div class="screen-icon">⚙️</div><div><h1>Settings</h1><p>System Name, Logo এবং প্রতিটি Sidebar Option customize করুন।</p></div></div><div class="panel"><h2>System Settings</h2><div class="form-grid"><div class="field"><label>System Name</label><input id="siteName" value="${esc(data.site.name)}"></div><div class="field"><label>System Logo</label><input id="siteLogo" value="${esc(data.site.logo)}"></div><div class="field"><label>Logo File</label><input id="siteLogoFile" type="file" accept="image/*"></div><div><img class="preview" id="sitePreview" src="${esc(data.site.logo)}"></div></div><button class="btn blue" onclick="saveSite()">💾 Save System Settings</button></div><div class="panel"><h2>Sidebar Options — প্রতিটি Option-এর Logo/Name/Content</h2><div id="optionList">${data.options.map(optionEditor).join('')}</div></div><div class="panel"><h2>Add New Option</h2><div class="form-grid"><div class="field"><label>Option Name</label><input id="newName" placeholder="যেমন: New Management"></div><div class="field"><label>Icon / Emoji</label><input id="newIcon" placeholder="📌"></div><div class="field full"><label>Content</label><textarea id="newContent" placeholder="এই Option চাপলে বড় Screen-এ যা দেখাবে..."></textarea></div><div class="field full"><label>Logo File (optional)</label><input id="newLogoFile" type="file" accept="image/*"></div></div><button class="btn green" onclick="addOption()">＋ Add Option</button></div>`}
function optionEditor(o){return `<div class="option-editor"><div class="option-logo">${iconHtml(o)}</div><div><input id="name-${o.id}" value="${esc(o.name)}"></div><div><textarea id="content-${o.id}">${esc(o.content)}</textarea><div class="file"><label>Logo: <input type="file" accept="image/*" onchange="readLogo(this,'${o.id}')"></label></div></div><div class="visibility"><label><input type="checkbox" id="visible-${o.id}" ${o.visible?'checked':''}> Show</label><br><input id="icon-${o.id}" value="${esc(o.icon)}" placeholder="Emoji" style="margin-top:5px"></div><div class="actions mini-actions"><button class="btn blue" onclick="saveOption('${o.id}')">Save</button><button class="btn red" onclick="removeOption('${o.id}')">Delete</button></div></div>`}
async function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function readLogo(input,id){if(input.files[0]){const o=data.options.find(x=>x.id===id);o.logo=await fileData(input.files[0]);toast('Logo selected — Save চাপুন')}}
async function saveSite(){const n=document.getElementById('siteName').value.trim();if(n)data.site.name=n;const url=document.getElementById('siteLogo').value.trim();if(url)data.site.logo=url;const f=document.getElementById('siteLogoFile').files[0];if(f)data.site.logo=await fileData(f);await saveData();renderApp();selectPage('settings');toast('System settings saved')}
async function saveOption(id){const o=data.options.find(x=>x.id===id);o.name=document.getElementById('name-'+id).value.trim()||o.name;o.content=document.getElementById('content-'+id).value;o.icon=document.getElementById('icon-'+id).value||'📌';o.visible=document.getElementById('visible-'+id).checked;await saveData();renderApp();selectPage(id);toast('Option saved')}
async function addOption(){const n=document.getElementById('newName').value.trim();if(!n){toast('Option Name দিন');return}let logo='';const f=document.getElementById('newLogoFile').files[0];if(f)logo=await fileData(f);const j=await api('/api/admin/options',{method:'POST',body:JSON.stringify({name:n,icon:document.getElementById('newIcon').value||'📌',content:document.getElementById('newContent').value||n+' content এখানে Show হবে।',logo})});data=j.data;renderApp();selectPage(data.options.at(-1).id);toast('New option added')}
async function removeOption(id){if(!confirm('এই Option delete করবেন?'))return;const j=await api('/api/admin/options/'+encodeURIComponent(id),{method:'DELETE'});data=j.data;renderApp();selectPage(data.options.find(o=>o.visible)?.id);toast('Option deleted')}
async function saveData(){const j=await api('/api/admin/data',{method:'PUT',body:JSON.stringify(data)});data=j.data}
function logout(){localStorage.removeItem('lb_admin_token');token=null;loginView()}
if(token)load();else loginView();
</script></body></html>
