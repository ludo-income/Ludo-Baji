:root{--ref-purple:#8b5cf6;--ref-purple2:#a66bea;--ref-dark:#10151f}
body{background:#f4f6f8}

.sidebar .nav:before{content:'Ludo Baji';display:flex;align-items:center;height:52px;padding-left:59px;margin:0 0 12px;color:#fff;font-size:19px;font-weight:800;white-space:nowrap;background-image:url('7543.jpg');background-size:43px 43px;background-repeat:no-repeat;background-position:7px center}

</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script>
const root=document.getElementById('root');let token=localStorage.getItem('lb9token'),data=null,active='dashboard';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function login(){root.innerHTML='<div class="login"><form class="login-card" id="loginForm"><h1>⚙️ Admin Login</h1><div class="field"><label>Username</label><input id="loginUser" value="admin" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" value="" autocomplete="current-password"></div><button class="btn green" style="width:100%">Login</button><div id="loginErr" class="err"></div></form></div>';document.getElementById('loginForm').addEventListener('submit',doLogin)}
async function doLogin(e){e.preventDefault();const er=document.getElementById('loginErr');er.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('loginUser').value.trim(),password:document.getElementById('loginPass').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');token=j.token;localStorage.setItem('lb9token',token);await load()}catch(x){er.textContent=x.message}}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(path,opt);let j={};try{j=await r.json()}catch{}if(r.status===401){token=null;localStorage.removeItem('lb9token');login();throw Error('Session expired')}if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{data=(await api('/api/admin/data')).data;renderApp()}catch(e){login()}}
function renderApp(){root.innerHTML='<div class="app" id="adminApp"><header class="topbar"><div class="brandline"><img class="site-logo" src="'+esc(data.site.logo||'7543.jpg')+'"><div class="site-name">'+esc(data.site.name||'Ludo Baji')+'</div><span class="admin-badge">Admin Panel</span></div><div class="topright"><span class="online">● Online</span><span>11 Sep 2026&nbsp; 02:20 PM</span><div class="userbox"><div class="avatar">👤</div><div><b>Admin</b><small>Super Admin</small></div><button class="btn red" onclick="logout()">Logout</button></div></div></header><button class="menu-toggle" id="menuToggle" onclick="toggleAdminMenu()">☰</button><div class="nav-overlay" id="navOverlay" onclick="closeAdminMenu()"></div><div class="shell"><aside class="sidebar" id="adminSidebar"><nav class="nav" id="nav"></nav></aside><main class="content"><div class="screen" id="screen"></div></main></div></div>';renderNav();select(active)}
function toggleAdminMenu(){const a=document.getElementById('adminApp');if(a.classList.contains('menu-open'))closeAdminMenu();else{a.classList.add('menu-open');document.getElementById('adminSidebar').classList.add('open');document.getElementById('navOverlay').classList.add('show')}}
function closeAdminMenu(){const a=document.getElementById('adminApp');if(!a)return;a.classList.remove('menu-open');document.getElementById('adminSidebar')?.classList.remove('open');document.getElementById('navOverlay')?.classList.remove('show')}
function renderNav(){document.getElementById('nav').innerHTML=data.adminMenus.filter(x=>x.visible).map(x=>'<button data-id="'+esc(x.id)+'"><span class="nav-icon">'+(x.logo?'<img src="'+esc(x.logo)+'">':esc(x.icon||'📌'))+'</span><span>'+esc(x.name)+'</span></button>').join('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>select(b.dataset.id))}
function select(id){active=id;const x=data.adminMenus.find(a=>a.id===id)||data.adminMenus[0];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===x.id));document.getElementById('screen').innerHTML=screenFor(x);document.getElementById('screen').scrollTop=0;if(x.id==='transaction-history')loadAdminTransactions();closeAdminMenu()}
function screenFor(x){if(x.id==='transaction-history')return transactionHistory();if(x.id==='dashboard')return dashboard();if(x.id==='settings')return settings();if(x.id==='homepage-settings')return homepage();if(x.id==='deposit-management')return depositManagement();if(x.id==='withdrawal-management')return withdrawalManagement();return '<h1 class="page-title">'+esc(x.name)+'</h1><p class="subtitle">'+esc(x.name)+' management</p><div class="panel"><h2>'+esc(x.name)+'</h2><p class="hint">এই বড় Screen-এ '+esc(x.name)+'-এর System থাকবে। এই ধাপে শুধু requested navigation layout রাখা হয়েছে।</p></div>'}
let depositStatusFilter='pending';
function depositManagement(){
  setTimeout(()=>loadAdminDeposits(depositStatusFilter),0);
  return `<h1 class="page-title">Deposit Management</h1><p class="subtitle">User-এর Deposit request দেখুন এবং Approve/Reject করুন। Approve করলে Gaming Balance-এ টাকা যোগ হবে।</p><div class="panel"><div class="deposit-filter"><button id="df-pending" onclick="loadAdminDeposits('pending')">Pending</button><button id="df-approved" onclick="loadAdminDeposits('approved')">Approved</button><button id="df-rejected" onclick="loadAdminDeposits('rejected')">Rejected</button><button id="df-all" onclick="loadAdminDeposits('all')">All</button></div><div id="adminDeposits">Loading...</div></div>`;
}
async function loadAdminDeposits(status='pending'){
  depositStatusFilter=status;const box=document.getElementById('adminDeposits');if(!box)return;
  ['pending','approved','rejected','all'].forEach(x=>document.getElementById('df-'+x)?.classList.toggle('active',x===status));
  box.innerHTML='Loading...';
  try{const j=await api('/api/admin/deposits?status='+encodeURIComponent(status));if(!j.deposits.length){box.innerHTML='<p class="hint">কোনো Deposit request পাওয়া যায়নি।</p>';return}
    box.innerHTML=j.deposits.map(d=>{const st=String(d.status||'pending');const buttons=st==='pending'?'<div class="deposit-actions"><button class="btn green" onclick="reviewAdminDeposit(\''+esc(String(d.id))+'\',\'approved\')">✓ Approve</button><button class="btn red" onclick="reviewAdminDeposit(\''+esc(String(d.id))+'\',\'rejected\')">✕ Reject</button></div>':'';const shot=d.screenshot?'<br><img class="deposit-shot" src="'+esc(d.screenshot)+'" alt="Payment screenshot">':'';return '<div class="deposit-card"><div class="deposit-head"><div><b>#'+esc(d.id)+' • '+esc(String(d.method).toUpperCase())+'</b><div class="deposit-meta">User: '+esc(d.user_code||'-')+'<br>Mobile: '+esc(d.phone||'-')+'<br>Amount: ৳'+Number(d.amount||0).toFixed(2)+'<br>Transaction ID: '+esc(d.transaction_id||'-')+'<br>Date: '+esc(new Date(d.created_at).toLocaleString())+'</div></div><b class="status-'+esc(st)+'">'+esc(st.toUpperCase())+'</b></div>'+shot+buttons+'</div>'}).join('');
  }catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}
}
async function reviewAdminDeposit(id,status){const note=prompt(status==='approved'?'Approve note (optional):':'Reject reason (optional):','');if(note===null)return;try{await api('/api/admin/deposits/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,note})});toast(status==='approved'?'Deposit Approved':'Deposit Rejected');await loadAdminDeposits(depositStatusFilter)}catch(e){toast(e.message)}}
let withdrawalStatusFilter='pending';
function withdrawalManagement(){setTimeout(()=>loadAdminWithdrawals(withdrawalStatusFilter),0);return '<h1 class="page-title">Withdrawal Management</h1><p class="subtitle">User-এর Withdrawal request দেখুন এবং Approve/Reject করুন। Request submit করার সময় Balance থেকে amount reserve করা হয়; Reject করলে সেই Balance-এ ফেরত যায়।</p><div class="panel"><div class="deposit-filter"><button id="wf-pending" onclick="loadAdminWithdrawals(\'pending\')">Pending</button><button id="wf-approved" onclick="loadAdminWithdrawals(\'approved\')">Approved</button><button id="wf-rejected" onclick="loadAdminWithdrawals(\'rejected\')">Rejected</button><button id="wf-all" onclick="loadAdminWithdrawals(\'all\')">All</button></div><div id="adminWithdrawals">Loading...</div></div>'}
async function loadAdminWithdrawals(status='pending'){withdrawalStatusFilter=status;const box=document.getElementById('adminWithdrawals');if(!box)return;['pending','approved','rejected','all'].forEach(x=>document.getElementById('wf-'+x)?.classList.toggle('active',x===status));box.innerHTML='Loading...';try{const j=await api('/api/admin/withdrawals?status='+encodeURIComponent(status));if(!j.withdrawals.length){box.innerHTML='<p class="hint">কোনো Withdrawal request পাওয়া যায়নি।</p>';return}box.innerHTML=j.withdrawals.map(d=>{const st=String(d.status||'pending');const buttons=st==='pending'?'<div class="deposit-actions"><button class="btn green" onclick="reviewAdminWithdrawal(\''+esc(String(d.id))+'\',\'approved\')">✓ Approve</button><button class="btn red" onclick="reviewAdminWithdrawal(\''+esc(String(d.id))+'\',\'rejected\')">✕ Reject</button></div>':'';const acct=String(d.account_number||'');const masked=acct.length>6?acct.slice(0,3)+'****'+acct.slice(-3):acct;return '<div class="deposit-card"><div class="deposit-head"><div><b>#'+esc(d.id)+' • '+esc(String(d.method).toUpperCase())+'</b><div class="deposit-meta">User: '+esc(d.user_code||'-')+'<br>Mobile: '+esc(d.phone||'-')+'<br>Amount: ৳'+Number(d.amount||0).toFixed(2)+'<br>Withdraw From: '+esc(d.balance_type||'winning')+' Balance<br>Account: '+esc(masked)+'<br>Date: '+esc(new Date(d.created_at).toLocaleString())+(d.note?'<br>Note: '+esc(d.note):'')+'</div></div><b class="status-'+esc(st)+'">'+esc(st.toUpperCase())+'</b></div>'+buttons+'</div>'}).join('')}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function reviewAdminWithdrawal(id,status){const note=prompt(status==='approved'?'Approve note (optional):':'Reject reason (optional):','');if(note===null)return;try{await api('/api/admin/withdrawals/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,note})});toast(status==='approved'?'Withdrawal Approved':'Withdrawal Rejected');await loadAdminWithdrawals(withdrawalStatusFilter)}catch(e){toast(e.message)}}
function transactionHistory(){return '<h1 class="page-title">Transaction History</h1><p class="subtitle">সব User-এর wallet transaction এবং balance record.</p><div class="panel"><div id="adminTxList" class="hint">Loading...</div></div>'}
async function loadAdminTransactions(){const box=document.getElementById('adminTxList');if(!box)return;try{const j=await api('/api/admin/transactions');const rows=j.transactions||[];if(!rows.length){box.innerHTML='<p class="hint">কোনো transaction পাওয়া যায়নি।</p>';return}box.innerHTML='<div style="overflow:auto"><table class="table"><tr><th>User</th><th>Type</th><th>Balance</th><th>Amount</th><th>Status</th><th>Reference</th><th>Date</th></tr>'+rows.map(t=>{const c=Number(t.balance_change??0);const sign=c>0?'+':c<0?'−':'';return '<tr><td>'+esc(t.user_code||'-')+'<br><span class="hint">'+esc(t.phone||'')+'</span></td><td>'+esc(String(t.type||'').toUpperCase())+'<br><span class="hint">'+esc(t.balance_type||'-')+'</span></td><td>৳ '+(t.balance_after==null?'—':Number(t.balance_after).toFixed(2))+'</td><td>'+sign+'৳'+Math.abs(c).toFixed(2)+'</td><td>'+esc(t.status||'-')+'</td><td>'+esc(t.reference||'-')+'</td><td>'+esc(new Date(t.created_at).toLocaleString())+'</td></tr>'}).join('')+'</table></div>'}catch(e){box.innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
function dashboard(){return '<h1 class="page-title">Dashboard</h1><p class="subtitle">Welcome back, Admin! Here\'s what\'s happening today.</p><div class="cards"><div class="stat blue"><div class="bigicon">👥</div><div><label>Total Users</label><strong>1,248</strong></div></div><div class="stat green"><div class="bigicon">💳</div><div><label>Total Deposit</label><strong>৳ 48,230</strong></div></div><div class="stat orange"><div class="bigicon">💸</div><div><label>Total Withdraw</label><strong>৳ 36,750</strong></div></div><div class="stat purple"><div class="bigicon">🎮</div><div><label>Total Played</label><strong>2,846</strong></div></div></div><div class="layout"><div class="panel quick"><h2>⚡ Quick Actions</h2><div class="quickgrid"><button onclick="select(&quot;match-create&quot;)"><span class="qi">🎮</span>Add Game</button><button onclick="select(&quot;banner-management&quot;)"><span class="qi">🖼️</span>Add Banner</button><button onclick="select(&quot;notifications&quot;)"><span class="qi">🔔</span>Add Notice</button><button onclick="select(&quot;settings&quot;)"><span class="qi">⚙️</span>Site Settings</button><button onclick="select(&quot;total-users&quot;)"><span class="qi">👤</span>Manage Users</button><button onclick="select(&quot;deposit-management&quot;)"><span class="qi">💳</span>Deposit/Withdraw</button><button onclick="select(&quot;transaction-history&quot;)"><span class="qi">📄</span>View Transactions</button><button onclick="select(&quot;homepage-settings&quot;)"><span class="qi">📑</span>Pages & Content</button></div></div><div class="panel logo-panel"><h2>🪪 Site Logo</h2><div class="logo-preview"><img src="'+esc(data.site.logo||'7543.jpg')+'"></div></div><div class="panel status-panel"><h2>✚ System Status</h2><div class="switchrow">Registration <span class="switch on"><i></i></span></div><div class="switchrow">Deposit <span class="switch on"><i></i></span></div><div class="switchrow">Withdraw <span class="switch on"><i></i></span></div><div class="switchrow">Game Play <span class="switch on"><i></i></span></div><div class="switchrow">Maintenance Mode <span class="switch"><i></i></span></div></div></div><div class="tables"><div class="panel"><h2>👤 Recent Users</h2><table class="table"><tr><th>ID</th><th>Username</th><th>Status</th><th>Joined</th></tr><tr><td>#10248</td><td>Rana123</td><td><span class="tag">Active</span></td><td>10 Sep 2026</td></tr><tr><td>#10247</td><td>Sakib007</td><td><span class="tag">Active</span></td><td>10 Sep 2026</td></tr><tr><td>#10246</td><td>Nishat99</td><td><span class="tag">Active</span></td><td>10 Sep 2026</td></tr></table></div><div class="panel"><h2>💳 Latest Transactions</h2><table class="table"><tr><th>User</th><th>Type</th><th>Amount</th></tr><tr><td>Rana123</td><td><span class="tag">Deposit</span></td><td>৳ 500</td></tr><tr><td>Sakib007</td><td><span class="tag red">Withdraw</span></td><td>৳ 1,000</td></tr><tr><td>Nishat99</td><td><span class="tag">Deposit</span></td><td>৳ 300</td></tr></table></div></div>'}
function settings(){return '<h1 class="page-title">Settings</h1><p class="subtitle">Change System Name, Logo and Admin Sidebar options.</p><div class="panel"><h2>Change Logo / System Name</h2><div class="settings-grid"><div class="field"><label>System Name</label><input id="siteName" value="'+esc(data.site.name)+'"></div><div class="field"><label>Logo URL</label><input id="siteLogo" value="'+esc(data.site.logo)+'"></div><div class="field"><label>Logo PNG/Image</label><input id="siteFile" type="file" accept="image/*"></div></div><button class="btn blue" onclick="saveSite()">💾 Save Changes</button></div><div class="panel"><h2>Admin Sidebar — Name / Logo / Show-Hide</h2>'+data.adminMenus.map(adminRow).join('')+'</div>'}
function adminRow(x){return '<div class="option-row"><div class="mini">'+(x.logo?'<img src="'+esc(x.logo)+'">':esc(x.icon||'📌'))+'</div><input id="name-'+x.id+'" value="'+esc(x.name)+'"><input id="icon-'+x.id+'" value="'+esc(x.icon||'📌')+'" placeholder="Icon / Emoji"><label><input id="vis-'+x.id+'" type="checkbox" '+(x.visible?'checked':'')+'> Show</label><div class="actions"><input type="file" accept="image/*" onchange="chooseAdminLogo(this,\''+x.id+'\')"><button class="btn green" onclick="saveAdmin(\''+x.id+'\')">Save</button></div></div>'}
function homepage(){return '<h1 class="page-title">Homepage Settings</h1><p class="subtitle">শুধু এখানকার Option-গুলো Main Page-এর Category-তে দেখাবে। Admin Sidebar-এর menu Main Page-এ যাবে না।</p><div class="panel"><h2>Add New Homepage Option</h2><div class="settings-grid"><div class="field"><label>Option Name</label><input id="mainName" placeholder="Deposit"></div><div class="field"><label>Icon / Emoji</label><input id="mainIcon" value="📌"></div><div class="field wide"><label>Content</label><textarea id="mainContent" placeholder="এই Option-এর content..."></textarea></div><div class="field"><label>Logo/Image</label><input id="mainFile" type="file" accept="image/*"></div></div><button class="btn green" onclick="addMain()">＋ Add Option</button></div><div class="panel"><h2>Main Page Options</h2>'+data.mainOptions.map(mainRow).join('')+'</div>'}
function mainRow(x){return '<div class="option-row"><div class="mini">'+(x.logo?'<img src="'+esc(x.logo)+'">':esc(x.icon||'📌'))+'</div><input id="mn-'+x.id+'" value="'+esc(x.name)+'"><input id="mi-'+x.id+'" value="'+esc(x.icon||'📌')+'"><label><input id="mv-'+x.id+'" type="checkbox" '+(x.visible?'checked':'')+'> Show</label><div class="actions"><input type="file" accept="image/*" onchange="chooseMainLogo(this,\''+x.id+'\')"><button class="btn blue" onclick="saveMain(\''+x.id+'\')">Save</button><button class="btn red" onclick="deleteMain(\''+x.id+'\')">Delete</button></div><textarea id="mc-'+x.id+'" class="wide" placeholder="Content">'+esc(x.content||'')+'</textarea></div>'}
async function file64(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function chooseAdminLogo(i,id){if(i.files[0]){data.adminMenus.find(x=>x.id===id).logo=await file64(i.files[0]);toast('Logo selected. Save করুন')}}
async function chooseMainLogo(i,id){if(i.files[0]){data.mainOptions.find(x=>x.id===id).logo=await file64(i.files[0]);toast('Logo selected. Save করুন')}}
async function saveSite(){data.site.name=document.getElementById('siteName').value.trim()||data.site.name;const f=document.getElementById('siteFile').files[0];data.site.logo=f?await file64(f):(document.getElementById('siteLogo').value.trim()||data.site.logo);await saveAll();toast('Saved');renderApp();select('settings')}
async function saveAdmin(id){const x=data.adminMenus.find(a=>a.id===id);x.name=document.getElementById('name-'+id).value.trim()||x.name;x.icon=document.getElementById('icon-'+id).value||'📌';x.visible=document.getElementById('vis-'+id).checked;await saveAll();toast('Admin Option saved');renderApp();select(id)}
async function saveMain(id){const x=data.mainOptions.find(a=>a.id===id);x.name=document.getElementById('mn-'+id).value.trim()||x.name;x.icon=document.getElementById('mi-'+id).value||'📌';x.visible=document.getElementById('mv-'+id).checked;x.content=document.getElementById('mc-'+id).value;await saveAll();toast('Main Page saved');renderApp();select('homepage-settings')}
async function addMain(){const n=document.getElementById('mainName').value.trim();if(!n)return toast('Option Name দিন');let logo='';const f=document.getElementById('mainFile').files[0];if(f)logo=await file64(f);const j=await api('/api/admin/main-options',{method:'POST',body:JSON.stringify({name:n,icon:document.getElementById('mainIcon').value||'📌',content:document.getElementById('mainContent').value||'',logo})});data=j.data;toast('Main Page Option added');renderApp();select('homepage-settings')}
async function deleteMain(id){if(!confirm('Delete করবেন?'))return;const j=await api('/api/admin/main-options/'+encodeURIComponent(id),{method:'DELETE'});data=j.data;toast('Deleted');renderApp();select('homepage-settings')}
async function saveAll(){const j=await api('/api/admin/data',{method:'PUT',body:JSON.stringify(data)});data=j.data}
function logout(){token=null;localStorage.removeItem('lb9token');login()}
if(token)load();else login();
