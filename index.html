<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Baji</title><style>
:root{--g:#18ad59;--d:#242b28;--c:#303934}*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:Arial;color:#202522}.app{max-width:720px;margin:auto}header{background:var(--d);padding:16px 20px 20px;border-radius:0 0 30px 30px}.head{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;border-radius:11px;object-fit:contain}.name{flex:1;color:#fff;font-size:25px;font-weight:bold}.profile{width:52px;height:52px;border:0;border-radius:50%;background:var(--g);font-size:27px;cursor:pointer}.search{margin-top:13px;background:#fff;border-radius:28px;padding:12px 15px;display:flex}.search input{width:100%;border:0;outline:0;font-size:16px}section{padding:22px 20px}.catTitle{display:flex;justify-content:space-between}.catTitle h2{margin:0 0 20px;font-size:27px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px}.cat{border:0;background:none;cursor:pointer;font-size:15px}.ico{width:72px;height:66px;margin:auto auto 7px;background:var(--d);border-radius:13px;display:grid;place-items:center;font-size:30px;color:#fff;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}.cat.active .ico{outline:4px solid #fff;background:#108844}.viewer{margin:0 20px 25px;padding:20px;border-radius:24px;background:var(--d);color:#fff;display:none}.viewer.show{display:block}.viewer h3{color:#53df8a;font-size:23px}.item{background:var(--c);padding:14px;border-radius:13px;margin-top:10px;display:flex;justify-content:space-between}.btn{border:0;border-radius:10px;background:#27c96d;color:#fff;padding:11px 16px;font-weight:bold;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0007}.card h2{margin:0 0 8px}.muted{color:#68736d;font-size:14px}.field{margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd4ce;border-radius:10px;font-size:16px;outline:0}.row{display:flex;gap:10px}.row>*{flex:1}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.err{min-height:22px;color:#c62828;margin-top:8px}.success{color:#087f3d}.profileBox{background:#f1f7f3;padding:14px;border-radius:14px;margin:14px 0}.hidden{display:none!important}@media(max-width:500px){.categories{gap:17px 8px}.ico{width:65px;height:60px}.name{font-size:22px}}
</style></head><body><div class="app"><header><div class="head"><img class="logo" src="7543.jpg"><div class="name">Ludo Baji</div><button class="profile" id="profileBtn">👤</button></div><div class="search"><input placeholder="Search here ..."> 🔍</div></header><section><div class="catTitle"><h2>Category</h2><span>☰</span></div><div class="categories" id="cats"></div></section><div class="viewer" id="view"></div></div>
<div class="modal" id="authModal"><div class="card"><button class="close" id="closeAuth">×</button><h2 id="authTitle">Login / Sign Up</h2><p class="muted">বাংলাদেশি মোবাইল নম্বর দিয়ে OTP-এর মাধ্যমে প্রবেশ করুন</p><div id="phoneStep"><div class="field"><label>মোবাইল নম্বর</label><input id="phone" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="11"></div><button class="btn" id="sendOtp" style="width:100%">OTP পাঠান</button></div><div id="otpStep" class="hidden"><div class="field"><label>৬ সংখ্যার OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><button class="btn" id="verifyOtp" style="width:100%">Verify & Login</button><div class="row" style="margin-top:10px"><button class="btn" id="backPhone" style="background:#68736d">নম্বর বদলান</button><button class="btn" id="resendOtp">আবার OTP</button></div></div><div id="authErr" class="err"></div></div></div>
<div class="modal" id="profileModal"><div class="card"><button class="close" id="closeProfile">×</button><h2>👤 Profile</h2><div id="profileContent"></div><div class="field"><label>নাম</label><input id="profileName" maxlength="60" placeholder="আপনার নাম"></div><button class="btn" id="saveProfile" style="width:100%">Save Profile</button><button class="btn" id="logoutUser" style="width:100%;margin-top:10px;background:#d84a4a">Logout</button><div id="profileErr" class="err"></div></div></div>
<script>
let selectedId=null,all=[],currentUser=null,pendingPhone='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const authModal=document.getElementById('authModal'),profileModal=document.getElementById('profileModal');
function authToken(){return localStorage.getItem('ludo_user_token')||''}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(authToken())headers.Authorization='Bearer '+authToken();const r=await fetch(path,{...opt,headers});const j=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{const r=await fetch('/api/site?t='+Date.now(),{cache:'no-store'}),d=await r.json();document.title=d.site?.name||'Ludo Baji';document.querySelector('.name').textContent=d.site?.name||'Ludo Baji';document.querySelector('.logo').src=d.site?.logo||'7543.jpg';all=(d.mainOptions||[]).filter(x=>x.visible);render()}catch(e){}}
function render(){const box=document.getElementById('cats');box.innerHTML='';all.forEach(s=>{const b=document.createElement('button');b.className='cat';b.innerHTML='<div class="ico">'+(s.logo?'<img src="'+esc(s.logo)+'">':esc(s.icon||'📌'))+'</div>'+esc(s.name);b.onclick=()=>show(s,b);box.appendChild(b)});if(all.length){let s=all.find(x=>x.id===selectedId)||all[0],b=[...box.children][all.indexOf(s)];show(s,b)}}
function show(s,b){selectedId=s.id;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b?.classList.add('active');const v=document.getElementById('view');v.classList.add('show');v.innerHTML='<h3>'+esc(s.icon||'📌')+' '+esc(s.name)+'</h3><p>'+esc(s.content||'')+'</p><div class="item">'+esc(s.content||'System content')+'</div>'}
function openAuth(){authModal.classList.add('show');document.getElementById('authErr').textContent='';if(authToken())loadProfile();}
function close(m){m.classList.remove('show')}
async function loadProfile(){try{const j=await api('/api/auth/me');currentUser=j.user;document.getElementById('profileContent').innerHTML='<div class="profileBox"><b>User ID:</b> '+esc(currentUser.user_code)+'<br><b>Mobile:</b> '+esc(currentUser.phone)+'</div>';document.getElementById('profileName').value=currentUser.name||'';profileModal.classList.add('show')}catch(e){localStorage.removeItem('ludo_user_token');currentUser=null;authModal.classList.add('show')}}
document.getElementById('profileBtn').onclick=()=>authToken()?loadProfile():openAuth();document.getElementById('closeAuth').onclick=()=>close(authModal);document.getElementById('closeProfile').onclick=()=>close(profileModal);
document.getElementById('sendOtp').onclick=async()=>{const p=document.getElementById('phone').value.trim();try{const j=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({phone:p})});pendingPhone=p;document.getElementById('phoneStep').classList.add('hidden');document.getElementById('otpStep').classList.remove('hidden');document.getElementById('authErr').className='err success';document.getElementById('authErr').textContent=j.dev_otp?'Test OTP: '+j.dev_otp:'OTP পাঠানো হয়েছে।';document.getElementById('otp').focus()}catch(e){document.getElementById('authErr').className='err';document.getElementById('authErr').textContent=e.message}};
document.getElementById('verifyOtp').onclick=async()=>{try{const j=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({phone:pendingPhone,otp:document.getElementById('otp').value.trim()})});localStorage.setItem('ludo_user_token',j.token);currentUser=j.user;close(authModal);loadProfile()}catch(e){document.getElementById('authErr').className='err';document.getElementById('authErr').textContent=e.message}};
document.getElementById('backPhone').onclick=()=>{document.getElementById('otpStep').classList.add('hidden');document.getElementById('phoneStep').classList.remove('hidden');document.getElementById('authErr').textContent=''};
document.getElementById('resendOtp').onclick=()=>document.getElementById('sendOtp').click();document.getElementById('saveProfile').onclick=async()=>{try{const j=await api('/api/auth/profile',{method:'PUT',body:JSON.stringify({name:document.getElementById('profileName').value.trim()})});currentUser=j.user;document.getElementById('profileErr').className='err success';document.getElementById('profileErr').textContent='Profile saved';}catch(e){document.getElementById('profileErr').className='err';document.getElementById('profileErr').textContent=e.message}};
document.getElementById('logoutUser').onclick=()=>{localStorage.removeItem('ludo_user_token');currentUser=null;close(profileModal);openAuth()};
load();setInterval(load,4000);
</script></body></html>
