<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Baji</title><style>
:root{--g:#18ad59;--d:#242b28;--c:#303934}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}body{background:var(--g);font-family:Arial;color:#202522}.app{width:430px;max-width:430px;min-width:430px;min-height:100vh;margin:0 auto}header{background:var(--d);padding:16px 20px 20px;border-radius:0 0 30px 30px}.head{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;border-radius:11px;object-fit:contain}.name{flex:1;color:#fff;font-size:25px;font-weight:bold}.profile{width:52px;height:52px;border:0;border-radius:50%;background:var(--g);font-size:27px;cursor:pointer}.search{margin-top:13px;background:#fff;border-radius:28px;padding:12px 15px;display:flex}.search input{width:100%;border:0;outline:0;font-size:16px}section{padding:22px 20px}.catTitle{display:flex;justify-content:space-between}.catTitle h2{margin:0 0 20px;font-size:27px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px}.cat{border:0;background:none;cursor:pointer;font-size:15px}.ico{width:72px;height:66px;margin:auto auto 7px;background:var(--d);border-radius:13px;display:grid;place-items:center;font-size:30px;color:#fff;overflow:hidden}.ico img{width:100%;height:100%;object-fit:cover}.cat.active .ico{outline:4px solid #fff;background:#108844}.viewer{margin:0 20px 25px;padding:20px;border-radius:24px;background:var(--d);color:#fff;display:none}.viewer.show{display:block}.viewer h3{color:#53df8a;font-size:23px}.item{background:var(--c);padding:14px;border-radius:13px;margin-top:10px;display:flex;justify-content:space-between}.btn{border:0;border-radius:10px;background:#27c96d;color:#fff;padding:11px 16px;font-weight:bold;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0007}.card h2{margin:0 0 8px}.muted{color:#68736d;font-size:14px}.field{margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd4ce;border-radius:10px;font-size:16px;outline:0}.row{display:flex;gap:10px}.row>*{flex:1}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}.err{min-height:22px;color:#c62828;margin-top:8px}.success{color:#087f3d}.profileBox{background:#f1f7f3;padding:14px;border-radius:14px;margin:14px 0}.hidden{display:none!important}@media(max-width:500px){.categories{gap:17px 8px}.ico{width:65px;height:60px}.name{font-size:22px}}
.wallet{padding:0 20px;margin-top:18px}.walletGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.balance{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 5px 18px #0002}.balance small{display:block;color:#68736d;font-weight:bold}.balance strong{display:block;margin-top:5px;font-size:24px;color:#168b4a}.balance.win strong{color:#b47b00}.quick{padding:20px}.quick h3{margin:0 0 14px;font-size:20px}.quickGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quickBtn{border:0;background:#fff;border-radius:14px;padding:12px 5px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px #0001}.quickBtn span{display:block;font-size:24px;margin-bottom:5px}.quickBtn:active{transform:scale(.98)}.loginHint{font-size:12px;color:#68736d;text-align:center;margin-top:10px}

@media(min-width:431px){body{min-width:430px}.app{width:430px;max-width:430px;min-width:430px;margin-left:auto;margin-right:auto}}
.mobile-device body{width:100%;min-width:0!important;overflow-x:hidden}.mobile-device .app{width:430px!important;min-width:430px!important;max-width:430px!important;margin-left:50%!important;margin-right:0!important;transform:translateX(-50%)!important}.mobile-device header,.mobile-device section,.mobile-device .wallet,.mobile-device .quick,.mobile-device .viewer{max-width:430px}.mobile-device .modal{width:100vw!important;min-width:0!important}.mobile-device .card{max-width:calc(100vw - 36px)!important}.mobile-device .quickGrid{grid-template-columns:repeat(3,1fr)!important}.mobile-device .categories{grid-template-columns:repeat(3,1fr)!important}

.depositPanel{background:#fff;border-radius:18px;padding:16px;color:#202522;margin-top:14px}.paymentChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.payChoice{border:2px solid #d7ded9;background:#f7faf8;border-radius:13px;padding:13px;font-weight:bold;font-size:16px;cursor:pointer}.payChoice.active{border-color:#18ad59;background:#e8fff0}.payNum{display:flex;align-items:center;gap:8px;background:#f0f5f2;border-radius:12px;padding:12px;margin:10px 0 14px}.payNum strong{flex:1;font-size:18px;letter-spacing:.4px}.copyBtn{border:0;background:#18ad59;color:#fff;border-radius:9px;padding:9px 12px;font-weight:bold}.depositPanel input[type=file]{padding:9px;background:#f7faf8}.depositHistory{margin-top:18px}.depRow{border:1px solid #dce4df;border-radius:12px;padding:11px;margin-top:9px;background:#fbfdfc}.depTop{display:flex;justify-content:space-between;gap:8px}.depStatus{font-size:12px;font-weight:bold;border-radius:20px;padding:5px 9px}.depStatus.pending{background:#fff3cd;color:#8a6200}.depStatus.approved{background:#d9f8e5;color:#087f3d}.depStatus.rejected{background:#ffe0e0;color:#a51d1d}.smallText{font-size:12px;color:#68736d;margin-top:5px}.preview{max-width:100%;max-height:180px;border-radius:10px;margin-top:8px;display:none}.withdrawPanel{background:#fff;border-radius:18px;padding:16px;color:#202522;margin-top:14px}.withdrawBalance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.withdrawBalance button{border:2px solid #d7ded9;background:#f7faf8;border-radius:13px;padding:13px;font-weight:bold;cursor:pointer}.withdrawBalance button.active{border-color:#18ad59;background:#e8fff0}.withdrawHistory{margin-top:18px}.statementPanel{background:#fff;border-radius:18px;padding:14px;color:#202522;margin-top:14px}.statementFilters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.statementFilters button{border:2px solid #d7ded9;background:#f7faf8;border-radius:11px;padding:9px;font-weight:bold;cursor:pointer}.statementFilters button.active{border-color:#18ad59;background:#e8fff0}.txRow{border:1px solid #dce4df;border-radius:12px;padding:11px;margin-top:9px;background:#fbfdfc}.txTop{display:flex;justify-content:space-between;gap:8px}.txAmount.plus{color:#087f3d}.txAmount.minus{color:#b51f1f}.txAmount.zero{color:#68736d}.txMeta{font-size:12px;color:#68736d;margin-top:5px}.txBalance{font-size:12px;color:#303934;margin-top:7px;background:#f0f5f2;border-radius:9px;padding:7px}
</style><script>(function(){
  var mobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia("(pointer:coarse)").matches) || (screen && screen.width <= 600);
  if(mobileDevice){ document.documentElement.classList.add("mobile-device"); }
})();</script>
</head><body><div class="app"><header><div class="head"><img class="logo" src="7543.jpg"><div class="name">Ludo Baji</div><button class="profile" id="profileBtn">👤</button></div><div class="search"><input placeholder="Search here ..."> 🔍</div></header><div class="wallet"><div class="walletGrid"><div class="balance"><small>🎮 Gaming Balance</small><strong id="gamingBalance">৳ 0.00</strong></div><div class="balance win"><small>🏆 Winning Balance</small><strong id="winningBalance">৳ 0.00</strong></div></div><div class="loginHint" id="walletHint">Login করলে আপনার Balance এখানে দেখা যাবে</div></div><div class="quick"><h3>Quick Access</h3><div class="quickGrid" id="quickGrid"></div></div><section><div class="catTitle"><h2>Category</h2><span>☰</span></div><div class="categories" id="cats"></div></section><div class="viewer" id="view"></div></div>
<div class="modal" id="authModal"><div class="card"><button class="close" id="closeAuth">×</button><h2 id="authTitle">Login / Sign Up</h2><p class="muted">বাংলাদেশি মোবাইল নম্বর দিয়ে OTP-এর মাধ্যমে প্রবেশ করুন</p><div id="phoneStep"><div class="field"><label>মোবাইল নম্বর</label><input id="phone" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="11"></div><button class="btn" id="sendOtp" style="width:100%">OTP পাঠান</button></div><div id="otpStep" class="hidden"><div class="field"><label>৬ সংখ্যার OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><button class="btn" id="verifyOtp" style="width:100%">Verify & Login</button><div class="row" style="margin-top:10px"><button class="btn" id="backPhone" style="background:#68736d">নম্বর বদলান</button><button class="btn" id="resendOtp">আবার OTP</button></div></div><div id="authErr" class="err"></div></div></div>
<div class="modal" id="profileModal"><div class="card"><button class="close" id="closeProfile">×</button><h2>👤 Profile</h2><div id="profileContent"></div><div class="field"><label>নাম</label><input id="profileName" maxlength="60" placeholder="আপনার নাম"></div><button class="btn" id="saveProfile" style="width:100%">Save Profile</button><button class="btn" id="logoutUser" style="width:100%;margin-top:10px;background:#d84a4a">Logout</button><div id="profileErr" class="err"></div></div></div>
<script>
let selectedId=null,all=[],currentUser=null,pendingPhone='',pendingAction='';
const quickItems=[['deposit','💳','Deposit'],['withdraw','💸','Withdraw'],['match','🎮','Matches'],['mymatch','🎯','My Matches'],['statement','🧾','My Statement'],['notifications','🔔','Notifications'],['support','💬','Customer Support'],['referral','🔗','Referral'],['leaderboard','🏆','Leaderboard']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const authModal=document.getElementById('authModal'),profileModal=document.getElementById('profileModal');
function authToken(){return localStorage.getItem('ludo_user_token')||''}
async function api(path,opt={}){const headers={'Content-Type':'application/json',...(opt.headers||{})};if(authToken())headers.Authorization='Bearer '+authToken();const r=await fetch(path,{...opt,headers});const j=await r.json().catch(()=>({error:'Server error'}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function load(){try{const r=await fetch('/api/site?t='+Date.now(),{cache:'no-store'}),d=await r.json();document.title=d.site?.name||'Ludo Baji';document.querySelector('.name').textContent=d.site?.name||'Ludo Baji';document.querySelector('.logo').src=d.site?.logo||'7543.jpg';all=(d.mainOptions||[]).filter(x=>x.visible);renderQuick();render();await refreshDashboard()}catch(e){}}
function renderQuick(){const q=document.getElementById('quickGrid');q.innerHTML='';quickItems.forEach(([id,icon,name])=>{const b=document.createElement('button');b.className='quickBtn';b.innerHTML='<span>'+icon+'</span>'+name;b.onclick=()=>quickOpen(id,name,icon);q.appendChild(b)})}
function quickOpen(id,name,icon){if(id==='deposit'){selectedId='deposit';openDeposit();return}if(id==='withdraw'){selectedId='withdraw';openWithdraw();return}if(id==='statement'){selectedId='statement';openStatement();return}const found=all.find(x=>x.id===id);if(found){const box=[...document.querySelectorAll('.cat')].find(x=>x.textContent.trim()===found.name);show(found,box);document.getElementById('view').scrollIntoView({behavior:'smooth',block:'start'});return}const v=document.getElementById('view');v.classList.add('show');v.innerHTML='<h3>'+icon+' '+esc(name)+'</h3><p>এই Section-এর বিস্তারিত System পরবর্তী ধাপে যুক্ত হবে।</p><div class="item"><span>'+esc(name)+'</span><button class="btn" onclick="openAuth()">Login</button></div>';}
async function refreshDashboard(){if(!authToken()){document.getElementById('gamingBalance').textContent='৳ 0.00';document.getElementById('winningBalance').textContent='৳ 0.00';document.getElementById('walletHint').textContent='Login করলে আপনার Balance এখানে দেখা যাবে';return}try{const j=await api('/api/user/dashboard');currentUser=j.user;document.getElementById('gamingBalance').textContent='৳ '+Number(j.dashboard.gaming_balance||0).toFixed(2);document.getElementById('winningBalance').textContent='৳ '+Number(j.dashboard.winning_balance||0).toFixed(2);document.getElementById('walletHint').textContent='User ID: '+j.user.user_code}catch(e){localStorage.removeItem('ludo_user_token');currentUser=null;document.getElementById('walletHint').textContent='Login করলে আপনার Balance এখানে দেখা যাবে'}}
function render(){const box=document.getElementById('cats');box.innerHTML='';all.forEach(s=>{const b=document.createElement('button');b.className='cat';b.innerHTML='<div class="ico">'+(s.logo?'<img src="'+esc(s.logo)+'">':esc(s.icon||'📌'))+'</div>'+esc(s.name);b.onclick=()=>show(s,b);box.appendChild(b)});if(all.length){let s=all.find(x=>x.id===selectedId)||all[0],b=[...box.children][all.indexOf(s)];show(s,b)}}
function show(s,b){selectedId=s.id;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b?.classList.add('active');if(s.id==='deposit'){openDeposit();return}if(s.id==='withdraw'){openWithdraw();return}const v=document.getElementById('view');v.classList.add('show');v.innerHTML='<h3>'+esc(s.icon||'📌')+' '+esc(s.name)+'</h3><p>'+esc(s.content||'')+'</p><div class="item">'+esc(s.content||'System content')+'</div>'}
function openAuth(action=''){pendingAction=action||'';authModal.classList.add('show');document.getElementById('authErr').textContent='';if(authToken()){if(pendingAction==='deposit')openDeposit();else if(pendingAction==='withdraw')openWithdraw();else loadProfile();}}
function close(m){m.classList.remove('show')}

let depositMethod='bkash',depositInfo=null;
async function openDeposit(){
  if(!authToken()){openAuth('deposit');return}
  const v=document.getElementById('view');v.classList.add('show');
  v.innerHTML='<h3>💳 Deposit</h3><p>নিচের bKash বা Nagad নম্বরে টাকা পাঠিয়ে Transaction ID ও Screenshot দিন।</p><div class="depositPanel"><b>Payment Method</b><div class="paymentChoices"><button class="payChoice active" id="payBkash" onclick="selectDepositMethod(\'bkash\')">💗 bKash</button><button class="payChoice" id="payNagad" onclick="selectDepositMethod(\'nagad\')">🟠 Nagad</button></div><div class="payNum"><strong id="payNumber">01301470686</strong><button class="copyBtn" onclick="copyPayNumber()">Copy</button></div><div class="field"><label>Deposit Amount (৳)</label><input id="depAmount" type="number" min="1" max="1000000" step="0.01" placeholder="যেমন 500"></div><div class="field"><label>Transaction ID</label><input id="depTxn" maxlength="100" placeholder="Transaction ID লিখুন"></div><div class="field"><label>Payment Screenshot</label><input id="depShot" type="file" accept="image/jpeg,image/png,image/webp"><img id="depPreview" class="preview"></div><button class="btn" style="width:100%" onclick="submitDeposit()">Deposit Submit</button><div id="depErr" class="err"></div></div><div class="depositHistory"><h3 style="color:#202522;font-size:19px">📜 Deposit History</h3><div id="depHistory">Loading...</div></div>';
  try{depositInfo=(await api('/api/deposit/info')).methods||[];selectDepositMethod(depositMethod);await loadDepositHistory();}catch(e){document.getElementById('depErr').textContent=e.message}
  const f=document.getElementById('depShot');f.onchange=()=>{const file=f.files[0],img=document.getElementById('depPreview');if(file){if(file.size>8*1024*1024){document.getElementById('depErr').textContent='Screenshot সর্বোচ্চ 8MB';f.value='';img.style.display='none';return}const r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display='block'};r.readAsDataURL(file)}};
}
function selectDepositMethod(method){depositMethod=method;const info=(depositInfo||[]).find(x=>x.id===method);const n=info?.number||(method==='bkash'?'01301470686':'01806097369');const num=document.getElementById('payNumber');if(num)num.textContent=n;document.getElementById('payBkash')?.classList.toggle('active',method==='bkash');document.getElementById('payNagad')?.classList.toggle('active',method==='nagad')}
async function copyPayNumber(){const n=document.getElementById('payNumber')?.textContent||'';try{await navigator.clipboard.writeText(n);toastMsg('Number copied')}catch{const t=document.createElement('textarea');t.value=n;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toastMsg('Number copied')}}
function toastMsg(msg){const e=document.getElementById('depErr');if(e){e.className='err success';e.textContent=msg;setTimeout(()=>{if(e.textContent===msg)e.textContent=''},1600)}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function submitDeposit(){
  const er=document.getElementById('depErr');er.className='err';er.textContent='';
  const amount=Number(document.getElementById('depAmount').value),txn=document.getElementById('depTxn').value.trim(),file=document.getElementById('depShot').files[0];
  if(!Number.isFinite(amount)||amount<=0){er.textContent='সঠিক Deposit Amount দিন';return}
  if(!/^[A-Za-z0-9._-]{3,100}$/.test(txn)){er.textContent='সঠিক Transaction ID দিন';return}
  if(!file){er.textContent='Payment Screenshot upload করুন';return}
  if(file.size>8*1024*1024){er.textContent='Screenshot সর্বোচ্চ 8MB';return}
  try{const screenshot=await fileToDataURL(file);const j=await api('/api/user/deposits',{method:'POST',body:JSON.stringify({method:depositMethod,amount,transaction_id:txn,screenshot})});er.className='err success';er.textContent=j.message||'Deposit request জমা হয়েছে';document.getElementById('depAmount').value='';document.getElementById('depTxn').value='';document.getElementById('depShot').value='';document.getElementById('depPreview').style.display='none';await loadDepositHistory()}catch(e){er.textContent=e.message}
}
let withdrawMethod='bkash',withdrawBalanceType='winning',withdrawInfo=null;
async function openWithdraw(){
  if(!authToken()){openAuth('withdraw');return}
  const v=document.getElementById('view');v.classList.add('show');
  v.innerHTML='<h3>💸 Withdraw</h3><p>আপনার Balance থেকে bKash বা Nagad account-এ টাকা নেওয়ার request দিন। Request submit করলে নির্ধারিত Balance থেকে amount সাময়িকভাবে কেটে Pending থাকবে।</p><div class="withdrawPanel"><b>Payment Method</b><div class="paymentChoices"><button class="payChoice active" id="wdBkash" onclick="selectWithdrawMethod(\'bkash\')">💗 bKash</button><button class="payChoice" id="wdNagad" onclick="selectWithdrawMethod(\'nagad\')">🟠 Nagad</button></div><div class="field"><label>Withdraw From</label><div class="withdrawBalance"><button id="wdWinning" class="active" onclick="selectWithdrawBalance(\'winning\')">🏆 Winning Balance<br><span id="wdWinningBal">৳ 0.00</span></button><button id="wdGaming" onclick="selectWithdrawBalance(\'gaming\')">🎮 Gaming Balance<br><span id="wdGamingBal">৳ 0.00</span></button></div></div><div class="field"><label>bKash/Nagad Account Number</label><input id="wdAccount" inputmode="numeric" maxlength="14" placeholder="01XXXXXXXXX"></div><div class="field"><label>Withdraw Amount (৳)</label><input id="wdAmount" type="number" min="100" max="1000000" step="0.01" placeholder="যেমন 500"></div><div class="smallText">Minimum Withdrawal: ৳100</div><button class="btn" style="width:100%;margin-top:12px" onclick="submitWithdrawal()">Withdrawal Submit</button><div id="wdErr" class="err"></div></div><div class="withdrawHistory"><h3 style="color:#202522;font-size:19px">📜 Withdrawal History</h3><div id="wdHistory">Loading...</div></div>';
  try{const j=await api('/api/deposit/info');withdrawInfo=j.methods||[];selectWithdrawMethod(withdrawMethod);await refreshWithdrawalBalances();await loadWithdrawalHistory()}catch(e){document.getElementById('wdErr').textContent=e.message}
}
function selectWithdrawMethod(method){withdrawMethod=method;document.getElementById('wdBkash')?.classList.toggle('active',method==='bkash');document.getElementById('wdNagad')?.classList.toggle('active',method==='nagad')}
function selectWithdrawBalance(type){withdrawBalanceType=type;document.getElementById('wdWinning')?.classList.toggle('active',type==='winning');document.getElementById('wdGaming')?.classList.toggle('active',type==='gaming')}
async function refreshWithdrawalBalances(){try{const j=await api('/api/user/dashboard');document.getElementById('wdWinningBal').textContent='৳ '+Number(j.dashboard.winning_balance||0).toFixed(2);document.getElementById('wdGamingBal').textContent='৳ '+Number(j.dashboard.gaming_balance||0).toFixed(2)}catch{}}
async function submitWithdrawal(){const er=document.getElementById('wdErr');er.className='err';er.textContent='';const account=document.getElementById('wdAccount').value.trim(),amount=Number(document.getElementById('wdAmount').value);if(!/^(01\d{9}|(?:\+880|880)1\d{9})$/.test(account)){er.textContent='সঠিক bKash/Nagad account number দিন';return}if(!Number.isFinite(amount)||amount<100||amount>1000000){er.textContent='Withdrawal amount ৳100 থেকে ৳1000000 এর মধ্যে হতে হবে';return}try{const j=await api('/api/user/withdrawals',{method:'POST',body:JSON.stringify({method:withdrawMethod,account_number:account,amount,balance_type:withdrawBalanceType})});er.className='err success';er.textContent=j.message||'Withdrawal request জমা হয়েছে';document.getElementById('wdAccount').value='';document.getElementById('wdAmount').value='';await refreshDashboard();await refreshWithdrawalBalances();await loadWithdrawalHistory()}catch(e){er.textContent=e.message}}
async function loadWithdrawalHistory(){const box=document.getElementById('wdHistory');if(!box)return;try{const j=await api('/api/user/withdrawals');if(!j.withdrawals.length){box.innerHTML='<div class="smallText">এখনো কোনো Withdrawal নেই।</div>';return}box.innerHTML=j.withdrawals.map(d=>{const st=d.status==='approved'?'Approved':d.status==='rejected'?'Rejected':'Pending';const acct=String(d.account_number||'');const masked=acct.length>6?acct.slice(0,3)+'****'+acct.slice(-3):acct;return '<div class="depRow"><div class="depTop"><b>'+esc(String(d.method).toUpperCase())+' • ৳'+Number(d.amount).toFixed(2)+'</b><span class="depStatus '+esc(d.status)+'">'+st+'</span></div><div class="smallText">Account: '+esc(masked)+' • '+esc(d.balance_type||'winning')+' balance</div><div class="smallText">'+new Date(d.created_at).toLocaleString()+'</div>'+(d.note?'<div class="smallText">Note: '+esc(d.note)+'</div>':'')+'</div>'}).join('')}catch(e){box.textContent=e.message}}
async function loadDepositHistory(){const box=document.getElementById('depHistory');if(!box)return;try{const j=await api('/api/user/deposits');if(!j.deposits.length){box.innerHTML='<div class="smallText">এখনো কোনো Deposit নেই।</div>';return}box.innerHTML=j.deposits.map(d=>{const st=d.status==='approved'?'Approved':d.status==='rejected'?'Rejected':'Pending';return '<div class="depRow"><div class="depTop"><b>'+esc(String(d.method).toUpperCase())+' • ৳'+Number(d.amount).toFixed(2)+'</b><span class="depStatus '+esc(d.status)+'">'+st+'</span></div><div class="smallText">TXN: '+esc(d.transaction_id||'-')+'</div><div class="smallText">'+new Date(d.created_at).toLocaleString()+'</div></div>'}).join('')}catch(e){box.textContent=e.message}}
let statementFilter='all';
async function openStatement(){
  if(!authToken()){openAuth('statement');return}
  const v=document.getElementById('view');v.classList.add('show');
  v.innerHTML='<h3>🧾 My Statement</h3><p>আপনার Wallet-এর সব balance movement ও transaction history এখানে দেখা যাবে।</p><div class="statementPanel"><div class="statementFilters"><button id="txAll" class="active" onclick="setStatementFilter(\'all\')">All</button><button id="txGaming" onclick="setStatementFilter(\'gaming\')">Gaming</button><button id="txWinning" onclick="setStatementFilter(\'winning\')">Winning</button><button id="txDeposit" onclick="setStatementFilter(\'deposit\')">Deposit</button><button id="txWithdraw" onclick="setStatementFilter(\'withdrawal\')">Withdrawal</button><button id="txOther" onclick="setStatementFilter(\'other\')">Other</button></div><div id="statementList">Loading...</div></div>';
  await loadStatement();
}
function setStatementFilter(f){statementFilter=f;['all','gaming','winning','deposit','withdrawal','other'].forEach(x=>document.getElementById('tx'+(x==='all'?'All':x==='gaming'?'Gaming':x==='winning'?'Winning':x==='deposit'?'Deposit':x==='withdrawal'?'Withdraw':'Other'))?.classList.toggle('active',x===f));loadStatement()}
async function loadStatement(){const box=document.getElementById('statementList');if(!box)return;try{const j=await api('/api/user/transactions');let rows=j.transactions||[];rows=rows.filter(t=>{if(statementFilter==='all')return true;if(statementFilter==='gaming'||statementFilter==='winning')return t.balance_type===statementFilter;if(statementFilter==='deposit'||statementFilter==='withdrawal')return t.type===statementFilter;return !['deposit','withdrawal'].includes(t.type)});if(!rows.length){box.innerHTML='<div class="smallText">এখনো কোনো transaction নেই।</div>';return}box.innerHTML=rows.map(t=>{const change=Number(t.balance_change??0),cls=change>0?'plus':change<0?'minus':'zero',sign=change>0?'+':change<0?'−':'';const type=String(t.type||'').replace(/_/g,' ');const status=String(t.status||'pending');const bal=t.balance_after==null?'—':'৳ '+Number(t.balance_after).toFixed(2);return '<div class="txRow"><div class="txTop"><b>'+esc(type.toUpperCase())+' • '+esc(t.balance_type||'-')+'</b><span class="txAmount '+cls+'">'+sign+'৳'+Math.abs(change).toFixed(2)+'</span></div><div class="txMeta">Status: '+esc(status)+' • Ref: '+esc(t.reference||'-')+'</div><div class="txMeta">'+esc(new Date(t.created_at).toLocaleString())+(t.note?' • '+esc(t.note):'')+'</div><div class="txBalance">Balance: ৳ '+(t.balance_before==null?'—':Number(t.balance_before).toFixed(2))+' → '+bal+'</div></div>'}).join('')}catch(e){box.textContent=e.message}}
async function loadProfile(){try{const j=await api('/api/auth/me');currentUser=j.user;refreshDashboard();document.getElementById('profileContent').innerHTML='<div class="profileBox"><b>User ID:</b> '+esc(currentUser.user_code)+'<br><b>Mobile:</b> '+esc(currentUser.phone)+'</div>';document.getElementById('profileName').value=currentUser.name||'';profileModal.classList.add('show')}catch(e){localStorage.removeItem('ludo_user_token');currentUser=null;authModal.classList.add('show')}}
document.getElementById('profileBtn').onclick=()=>authToken()?loadProfile():openAuth();document.getElementById('closeAuth').onclick=()=>close(authModal);document.getElementById('closeProfile').onclick=()=>close(profileModal);
document.getElementById('sendOtp').onclick=async()=>{const p=document.getElementById('phone').value.trim();try{const j=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({phone:p})});pendingPhone=p;document.getElementById('phoneStep').classList.add('hidden');document.getElementById('otpStep').classList.remove('hidden');document.getElementById('authErr').className='err success';document.getElementById('authErr').textContent=j.dev_otp?'Test OTP: '+j.dev_otp:'OTP পাঠানো হয়েছে।';document.getElementById('otp').focus()}catch(e){document.getElementById('authErr').className='err';document.getElementById('authErr').textContent=e.message}};
document.getElementById('verifyOtp').onclick=async()=>{try{const j=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({phone:pendingPhone,otp:document.getElementById('otp').value.trim()})});localStorage.setItem('ludo_user_token',j.token);currentUser=j.user;const action=pendingAction;pendingAction='';close(authModal);await refreshDashboard();if(action==='deposit')openDeposit();else if(action==='withdraw')openWithdraw();else if(action==='statement')openStatement();else loadProfile()}catch(e){document.getElementById('authErr').className='err';document.getElementById('authErr').textContent=e.message}};
document.getElementById('backPhone').onclick=()=>{document.getElementById('otpStep').classList.add('hidden');document.getElementById('phoneStep').classList.remove('hidden');document.getElementById('authErr').textContent=''};
document.getElementById('resendOtp').onclick=()=>document.getElementById('sendOtp').click();document.getElementById('saveProfile').onclick=async()=>{try{const j=await api('/api/auth/profile',{method:'PUT',body:JSON.stringify({name:document.getElementById('profileName').value.trim()})});currentUser=j.user;document.getElementById('profileErr').className='err success';document.getElementById('profileErr').textContent='Profile saved';}catch(e){document.getElementById('profileErr').className='err';document.getElementById('profileErr').textContent=e.message}};
document.getElementById('logoutUser').onclick=()=>{localStorage.removeItem('ludo_user_token');currentUser=null;close(profileModal);openAuth()};
load();setInterval(load,4000);
</script></body></html>
