<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Baji</title><style>
:root{--g:#18ad59;--d:#242b28;--c:#303934}*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:Arial;color:#202522}.app{max-width:720px;margin:auto}header{background:var(--d);padding:16px 20px 20px;border-radius:0 0 30px 30px}.head{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;border-radius:11px;object-fit:contain}.name{flex:1;color:#fff;font-size:25px;font-weight:bold}.profile{width:52px;height:52px;border:0;border-radius:50%;background:var(--g);font-size:27px}.search{margin-top:13px;background:#fff;border-radius:28px;padding:12px 15px;display:flex}.search input{width:100%;border:0;outline:0;font-size:16px}section{padding:22px 20px}.catTitle{display:flex;justify-content:space-between}.catTitle h2{margin:0 0 20px;font-size:27px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px}.cat{border:0;background:none;cursor:pointer;font-size:15px}.ico{width:72px;height:66px;margin:auto auto 7px;background:var(--d);border-radius:13px;display:grid;place-items:center;font-size:30px;color:#fff}.cat.active .ico{outline:4px solid #fff;background:#108844}.viewer{margin:0 20px 25px;padding:20px;border-radius:24px;background:var(--d);color:#fff;display:none}.viewer.show{display:block}.viewer h3{color:#53df8a;font-size:23px}.item{background:var(--c);padding:14px;border-radius:13px;margin-top:10px;display:flex;justify-content:space-between}.btn{border:0;border-radius:10px;background:#27c96d;color:#fff;padding:11px 16px;font-weight:bold}</style></head><body><div class="app"><header><div class="head"><img class="logo" src="7543.jpg"><div class="name">Ludo Baji</div><button class="profile">👤</button></div><div class="search"><input placeholder="Search here ..."> 🔍</div></header><section><div class="catTitle"><h2>Category</h2><span>☰</span></div><div class="categories" id="cats"></div></section><div class="viewer" id="view"></div></div><script>
let selectedId=null,all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/site?t='+Date.now(),{cache:'no-store'});const d=await r.json();document.title=d.site?.name||'Ludo Baji';document.querySelector('.name').textContent=d.site?.name||'Ludo Baji';document.querySelector('.logo').src=d.site?.logo||'7543.jpg';all=(d.mainOptions||[]).filter(x=>x.visible);render()}catch(e){}}
function render(){const box=document.getElementById('cats');box.innerHTML='';all.forEach((s,i)=>{const b=document.createElement('button');b.className='cat';b.innerHTML='<div class="ico">'+(s.logo?'<img src="'+esc(s.logo)+'">':esc(s.icon||'📌'))+'</div>'+esc(s.name);b.onclick=()=>show(s,b);box.appendChild(b)});if(all.length){let s=all.find(x=>x.id===selectedId)||all[0];let b=[...box.children][all.indexOf(s)];show(s,b)}}
function show(s,b){selectedId=s.id;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b?.classList.add('active');const v=document.getElementById('view');v.classList.add('show');v.innerHTML='<h3>'+esc(s.icon||'📌')+' '+esc(s.name)+'</h3><p>'+esc(s.content||'')+'</p><div class="item">'+esc(s.content||'System content')+'</div>'}
load();setInterval(load,4000);
</script></body></html>
