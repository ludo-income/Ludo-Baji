<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Baji</title><style>
:root{--g:#18ad59;--d:#242b28;--c:#303934}*{box-sizing:border-box}body{margin:0;background:var(--g);font-family:Arial;color:#202522}.app{max-width:720px;margin:auto}header{background:var(--d);padding:16px 20px 20px;border-radius:0 0 30px 30px}.head{display:flex;align-items:center;gap:12px}.logo{width:55px;height:55px;border-radius:11px;object-fit:contain}.name{flex:1;color:#fff;font-size:25px;font-weight:bold}.profile{width:52px;height:52px;border:0;border-radius:50%;background:var(--g);font-size:27px}.search{margin-top:13px;background:#fff;border-radius:28px;padding:12px 15px;display:flex}.search input{width:100%;border:0;outline:0;font-size:16px}section{padding:22px 20px}.catTitle{display:flex;justify-content:space-between}.catTitle h2{margin:0 0 20px;font-size:27px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px}.cat{border:0;background:none;cursor:pointer;font-size:15px}.ico{width:72px;height:66px;margin:auto auto 7px;background:var(--d);border-radius:13px;display:grid;place-items:center;font-size:30px;color:#fff}.cat.active .ico{outline:4px solid #fff;background:#108844}.viewer{margin:0 20px 25px;padding:20px;border-radius:24px;background:var(--d);color:#fff;display:none}.viewer.show{display:block}.viewer h3{color:#53df8a;font-size:23px}.item{background:var(--c);padding:14px;border-radius:13px;margin-top:10px;white-space:pre-wrap}.empty{padding:30px;text-align:center;color:#fff}
</style></head><body><div class="app"><header><div class="head"><img class="logo" id="logo" src="7543.jpg"><div class="name" id="siteName">Ludo Baji</div><button class="profile">👤</button></div><div class="search"><input id="search" placeholder="Search here ..."> 🔍</div></header><section><div class="catTitle"><h2>Category</h2><span>☰</span></div><div class="categories" id="cats"></div></section><div class="viewer" id="view"></div></div><script>
let state={settings:{name:'Ludo Baji',logo:'7543.jpg'},options:[]};
const $=id=>document.getElementById(id);
async function load(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error();state=await r.json();apply();render()}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])}
function apply(){$('siteName').textContent=state.settings?.name||'Ludo Baji';$('logo').src=state.settings?.logo||'7543.jpg';document.title=state.settings?.name||'Ludo Baji'}
function render(){const list=state.options||[];$('cats').innerHTML='';list.forEach((s,i)=>{const b=document.createElement('button');b.className='cat'+(!i?' active':'');b.innerHTML='<div class="ico">'+esc(s.icon)+'</div>'+esc(s.name);b.onclick=()=>show(s,b);$('cats').appendChild(b)});if(list[0])show(list[0],$('cats').firstChild);else $('view').innerHTML='<div class="empty">কোনো Option এখনো যোগ করা হয়নি।</div>'}
function show(s,b){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('view').classList.add('show');$('view').innerHTML='<h3>'+esc(s.icon)+' '+esc(s.name)+'</h3><div class="item">'+esc(s.content)+'</div>'}
$('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.cat').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')});
load();setInterval(load,3000);
</script></body></html>
